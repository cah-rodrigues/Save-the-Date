name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um deploy por branch de cada vez. Se voce empurrar dois commits seguidos,
# o primeiro build e cancelado e so o mais recente vai pro ar.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  CF_PROJECT_NAME: carlaebreno

jobs:
  deploy:
    name: Build e deploy (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publicar na Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch` define se o deploy e producao ou preview: a branch de
          # producao configurada no projeto (main) vai para o dominio principal,
          # qualquer outra gera uma URL de preview propria.
          command: >-
            pages deploy dist
            --project-name=${{ env.CF_PROJECT_NAME }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Resumo do deploy
        run: |
          {
            echo "### Deploy concluido"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.head_ref || github.ref_name }}\` |"
            echo "| URL | ${{ steps.cloudflare.outputs.deployment-url }} |"
            echo "| Producao | https://${{ env.CF_PROJECT_NAME }}.pages.dev |"
          } >> "$GITHUB_STEP_SUMMARY"
